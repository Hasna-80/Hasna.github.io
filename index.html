<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Hasna</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Reset & Forest Green + Gold Color Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Forest Green Base Colors */
            --bg-dark: #0A1610;        /* Deep Forest Green */
            --bg-card: #12241B;        /* Slightly lighter card background */
            --bg-card-hover: #193326;  /* Elevated green on hover */
            --border-color: #1F3D2E;   /* Muted green border */
            
            /* Gold Accents */
            --gold-primary: #D4AF37;   /* Classic Gold */
            --gold-light: #F3E5AB;     /* Soft Gold */
            --gold-glow: rgba(212, 175, 55, 0.25);

            /* Typography Colors */
            --text-white: #FFFFFF;     /* Bright White for main headings */
            --text-muted: #A3B8AD;     /* Soft sage/silver green for body copy */
            
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-gold: 0 6px 20px rgba(212, 175, 55, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-muted);
            line-height: 1.6;
            padding-bottom: 3rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Navigation Header */
        header {
            background-color: rgba(10, 22, 16, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-white);
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--gold-primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--gold-primary);
        }

        /* Section Layouts */
        section {
            padding: 4.5rem 0;
        }

        .section-title {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-white);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 45px;
            height: 3.5px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
            border-radius: 2px;
            margin-top: 10px;
        }

        .subsection-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--gold-light);
            margin-bottom: 1.2rem;
            margin-top: 1rem;
        }

        /* 1. Personal Statement / Hero Section */
        #hero {
            text-align: center;
            padding: 6rem 0 3rem;
        }

        .hero-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 1.25rem;
            line-height: 1.2;
        }

        .personal-statement {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
            font-weight: 400;
            line-height: 1.6;
        }

        .personal-statement span {
            color: var(--gold-light);
            font-weight: 600;
        }

        /* 2. Skills Section */
        .skills-group {
            margin-bottom: 2.5rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .skill-card {
            background: var(--bg-card);
            padding: 1.2rem 1rem;
            border-radius: var(--radius);
            text-align: center;
            font-weight: 600;
            color: var(--text-white);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-gold);
            color: var(--gold-light);
        }

        /* 3. Projects Section */
        .projects-grid {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .project-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: var(--shadow-gold);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .project-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-white);
        }

        .project-tag {
            background-color: rgba(212, 175, 55, 0.12);
            color: var(--gold-primary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .project-details {
            margin-bottom: 1.5rem;
        }

        .project-details ul {
            list-style: none;
            margin-top: 0.75rem;
        }

        .project-details li {
            position: relative;
            padding-left: 1.25rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .project-details li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--gold-primary);
        }

        .project-results {
            background-color: rgba(10, 22, 16, 0.6);
            border-left: 3px solid var(--gold-primary);
            padding: 0.75rem 1rem;
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-top: 1rem;
            font-size: 0.92rem;
            color: var(--text-white);
        }

        /* Embedded Visual Mockups */
        .visual-container {
            background-color: #0A140F;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 1.5rem;
        }

        .visual-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        /* Diagram 1: Workflow */
        .workflow-diagram {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .workflow-step {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            text-align: center;
            min-width: 100px;
            font-size: 0.8rem;
            color: var(--text-white);
        }

        .workflow-arrow {
            color: var(--gold-primary);
            font-weight: bold;
        }

        /* Table 2: Excel Visual */
        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .excel-table th {
            background-color: var(--bg-card);
            color: var(--gold-light);
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .excel-table td {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(31, 61, 46, 0.5);
        }

        .status-verified {
            color: #4ADE80;
            font-weight: 600;
        }

        /* Board 3: Trello Board Visual */
        .trello-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .trello-col {
            background-color: var(--bg-card);
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .trello-col-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.25rem;
        }

        .trello-card {
            background-color: #0A1610;
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            font-size: 0.72rem;
            color: var(--text-white);
            margin-bottom: 0.4rem;
            border-left: 2px solid var(--gold-primary);
        }

        /* Footer */
        footer
